interface:
  display_name: Periplus
  short_description: Research and publish complete, illustrated travel brochures
  default_prompt: Use $periplus to research and generate a complete Seven Ninths Travel
    Brochure from my destination, any number of date periods, outbound origin, final
    return destination, optional hotel and preferences. Accept Chinese or any other
    input language. Default narration to Simplified Chinese unless I request another
    language. Deliver DOCX and PDF with English date-based filenames, Oswald Western
    text, genuine three-level paginated contents, branded headers, real area maps
    and a specific photo for every attraction, shop, dining venue and hotel. Recommend
    concrete transport services with preceding-activity and connection buffers. Make
    Tours experiential and Tickets & Prices a pass/combination-discount catalogue;
    keep internal reasoning and default budgets out of the guide. Keep all skill instructions
    and examples in English.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
